# Local Qdrant for development on the GPU box.
#
#   docker compose up -d       start
#   docker compose logs -f     follow logs
#   docker compose down        stop (data is kept in the named volume)
#   docker compose down -v     stop and DELETE the index
#
# Dashboard: http://localhost:6333/dashboard
#
# With this running, leave QDRANT_URL=http://localhost:6333 in .env and leave
# QDRANT_API_KEY empty. To use Qdrant Cloud instead, just point QDRANT_URL at
# the cluster and set the API key — nothing else changes.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: medical-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # Room for the HNSW graph of a large medical corpus.
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: 64
      QDRANT__LOG_LEVEL: INFO
    # No healthcheck: the Qdrant image ships without curl/wget, and a check that
    # cannot run marks the container unhealthy for no reason. Use
    # `python scripts/check_setup.py` to confirm connectivity instead.

volumes:
  qdrant_storage:
